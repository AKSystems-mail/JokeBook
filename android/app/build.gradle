plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}
apply plugin: 'com.google.gms.google-services'

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}


android {
    namespace = "com.jokebook.app"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.jokebook.app"
        minSdk 24
        targetSdk 35
        multiDexEnabled true
        versionCode flutterVersionCode.toInteger()  // You can set a version code here if needed
        versionName flutterVersionName
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

signingConfigs {
    release {
        storeFile file('keystore.jks')
        storePassword project.findProperty('KEY_STORE_PASSWORD') ?: ""
        keyAlias project.findProperty('KEY_ALIAS') ?: ""
        keyPassword project.findProperty('KEY_PASSWORD') ?: ""
    }
    debug {
        storeFile file('keystore.jks')
        storePassword project.findProperty('KEY_STORE_PASSWORD') ?: ""
        keyAlias project.findProperty('KEY_ALIAS') ?: ""
        keyPassword project.findProperty('KEY_PASSWORD') ?: ""
    }
}

    buildTypes {
        release {
            if(project.findProperty('KEY_STORE_PASSWORD') != null){
                signingConfig signingConfigs.release
                minifyEnabled true
                shrinkResources true
            }
        }
        debug{
            signingConfig signingConfigs.debug
        }
    }
}
dependencies {
    implementation "androidx.activity:activity-ktx:1.9.0"
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation platform('com.google.firebase:firebase-bom:32.2.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.android.gms:play-services-auth:20.6.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
}



flutter {
    source = "../.."
}