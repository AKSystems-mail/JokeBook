plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.jokebook.app"
    compileSdk = 34
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId "com.jokebook.app"
        minSdk 24
        targetSdk 34
        versionCode 1  // You can set a version code here if needed
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            if (project.findProperty('KEY_STORE_PASSWORD') != null) {
                storeFile file('android/app/keystore.jks')
                storePassword KEY_STORE_PASSWORD
                keyAlias KEY_ALIAS
                keyPassword KEY_PASSWORD
            }
        }
        debug {
            storeFile file("keystore.jks")
            storePassword "newpassword"
            keyAlias "upload"
            keyPassword "newpassword"
        }
    }

    buildTypes {
        release {
            if(project.findProperty('KEY_STORE_PASSWORD') != null){
                signingConfig signingConfigs.release
                minifyEnabled true
                shrinkResources true
            }
        }
        debug{
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}