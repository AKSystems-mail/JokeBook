plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.jokebook.app"
    compileSdk = 34
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId "com.jokebook.app"
        minSdk 24
        targetSdk 34
        versionCode 1  // You can set a version code here if needed
        versionName "1.0.0"
    }

signingConfigs {
    release {
        storeFile file('keystore.jks')
        storePassword project.findProperty('KEY_STORE_PASSWORD') ?: ""
        keyAlias project.findProperty('KEY_ALIAS') ?: ""
        keyPassword project.findProperty('KEY_PASSWORD') ?: ""
    }
    debug {
        storeFile file('keystore.jks')
        storePassword project.findProperty('KEY_STORE_PASSWORD') ?: ""
        keyAlias project.findProperty('KEY_ALIAS') ?: ""
        keyPassword project.findProperty('KEY_PASSWORD') ?: ""
    }
}

    buildTypes {
        release {
            if(project.findProperty('KEY_STORE_PASSWORD') != null){
                signingConfig signingConfigs.release
                minifyEnabled true
                shrinkResources true
            }
        }
        debug{
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}