plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}
apply plugin: 'com.google.gms.google-services'


android {
    namespace = "com.jokebook.app"
    compileSdk = 36
    ndkVersion = "28.0.12433566"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId "com.jokebook.app"
        minSdk 24
        targetSdk 36
        versionCode 7
        versionName "2.2.10 Stable"
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

signingConfigs {
    release {
        storeFile file('keystore.jks')
        storePassword project.findProperty('KEY_STORE_PASSWORD') ?: ""
        keyAlias project.findProperty('KEY_ALIAS') ?: ""
        keyPassword project.findProperty('KEY_PASSWORD') ?: ""
    }
    debug {
        storeFile file('keystore.jks')
        storePassword project.findProperty('KEY_STORE_PASSWORD') ?: ""
        keyAlias project.findProperty('KEY_ALIAS') ?: ""
        keyPassword project.findProperty('KEY_PASSWORD') ?: ""
    }
}

    buildTypes {
        release {
            if(project.findProperty('KEY_STORE_PASSWORD') != null){
                signingConfig signingConfigs.release
                minifyEnabled true
                shrinkResources true
            }
        }
        debug{
            signingConfig signingConfigs.debug
        }
    }
}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation platform('com.google.firebase:firebase-bom:32.2.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.android.gms:play-services-auth:20.6.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
}



flutter {
    source = "../.."
}