name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0' # Pin to a specific version
          channel: 'stable'

      - name: Flutter version check
        run: flutter --version

      - name: Clear Flutter Cache
        run: flutter clean

      - name: Set up Dart version
        run: |
          echo "dart-sdk: '3.3.0'" >> pubspec.yaml

      - name: Upgrade Dependencies
        run: flutter upgrade

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Enable AndroidX and Jetifier
        run: |
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Create gradle.properties
        run: |
          echo "storePassword=${{ secrets.KEY_STORE_PASSWORD }}" >> android/gradle.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/gradle.properties
          echo "storeFile=../keystore.jks" >> android/gradle.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/gradle.properties

      - name: Add google-services.json
        run: cp google-services.json android/app/google-services.json

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk
