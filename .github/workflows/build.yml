name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x' # Or a specific version like '3.10.x', 'latest'
          channel: 'stable'

      - name: Flutter doctor -v
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Enable AndroidX and Jetifier (Important for Flutter)
        run: |
          cd android
          ./gradlew properties | grep android.useAndroidX=true || echo "android.useAndroidX=true" >> gradle.properties
          ./gradlew properties | grep android.enableJetifier=true || echo "android.enableJetifier=true" >> gradle.properties
          cd ..

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks
      - name: Build APK (Release)
        run: flutter build apk --release
        working-directory: ./
        env:
          KEY_STORE_PATH: android/app/keystore.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk